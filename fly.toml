# Fly.io config — the fastest path to a public https URL.
#
#   fly launch --copy-config --no-deploy   # creates the app (pick a name/region)
#   fly secrets set APP_PASSWORD=your-password   # recommended: protect the app
#   fly deploy
#
# Your app will be live at https://<app-name>.fly.dev
app = "youtube-downloader"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5176"
  HOST = "0.0.0.0"
  MAX_CONCURRENT_DOWNLOADS = "2"

[http_service]
  internal_port = 5176
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    # downloads can take a while; allow long-lived connections
    Connection = "keep-alive"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # Runs the web app + the bundled PO-token provider, so give it ~1 GB.
  memory = "1024mb"
